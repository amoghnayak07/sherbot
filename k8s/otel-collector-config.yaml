apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue

    receivers:
      filelog:
        include: [/var/log/pods/**/*.log]
        include_file_path: true
        start_at: beginning
        operators:
          - type: regex_parser
            regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[^/]+)/(?P<container_name>[^/]+)/'
            parse_from: attributes["log.file.path"]
            parse_to: attributes.k8s_path
          - type: move
            from: attributes.k8s_path.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.k8s_path.pod_name
            to: resource["k8s.pod.name"]
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]+) (?P<log>.*)$'
          - type: json_parser
            parse_from: attributes.log
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      k8sattributes:
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse-svc.monitoring:9000
        database: otel
        ttl: 24h
        sending_queue:
          enabled: true
          storage: file_storage

    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [k8sattributes]
          exporters: [clickhouse]
